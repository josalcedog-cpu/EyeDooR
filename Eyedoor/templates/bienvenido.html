<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Sensor</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">

  <style>
    body {
      background-color: #111;
      font-family: "Poppins", sans-serif;
      color: white;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panel {
      background-color: #1b1b1b;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 800px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 500px;
      position: relative;
    }

    .camera-box {
      background-color: black;
      width: 320px;
      height: 240px;
      border: 4px solid #222;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .right-column {
      width: 260px;
      height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* mensaje de la foto */
    #mensaje {
      position: absolute;
      top: 100px; /* aca sube o baja el mensaje de la foto */
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: bold;
      color: #27ae60;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      margin-top: 40px;
    }

    button {
      width: 220px;
      height: 50px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      background-color: #999;
      color: black;
      font-weight: bold;
    }

    button.active {
      background-color: #d62828;
      color: white;
    }

    .info {
      font-size: 14px;
      color: #bfbfbf;
      text-align: center;
      width: 100%;
      line-height: 22px;
      white-space: nowrap;
    }

    .logout-btn {
      display: block;
      width: 150px;
      text-align: center;
      background-color: #d62828;
      padding: 12px 0;
      margin-top: 30px;
      border-radius: 6px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background-color: #b71c1c;
    }

  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body>

  <div class="panel">

    <div class="camera-box">
      <iframe src="http://10.90.173.123" width="100%" height="100%" frameborder="0"></iframe>
    </div>

    <div class="right-column">

      <div id="timbre-notificacion" 
        style="font-size:16px; color:#f1c40f; font-weight:bold; margin-top:10px; text-align:center;">
      </div>

      <div id="mensaje"></div>

      <div class="buttons">
        <button id="btnFoto">📸 Fotografiar</button>
      </div>

      <div class="info">
        Correo: {{ email }} <br>
        Código de Producto: {{ product_code }}
      </div>
      
      <a href="{{ url_for('logout') }}" class="logout-btn">Cerrar sesión</a>
    
    </div>

  </div>

  <script>

    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.pushState(null, null, location.href);
    };
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        window.location.reload();
      }
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDQ9Vq0xYg_e82XKOKajuLtlt8YRanxVdw",
      authDomain: "eyedoor-49c27.firebaseapp.com",
      databaseURL: "https://eyedoor-49c27-default-rtdb.firebaseio.com/",
      projectId: "eyedoor-49c27",
      storageBucket: "eyedoor-49c27.firebasestorage.app",
      messagingSenderId: "176516386747",
      appId: "1:176516386747:web:2f6cc69249f845cd28be9e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const btnFoto = document.getElementById("btnFoto");
    const mensaje = document.getElementById("mensaje");
    const timbreDiv = document.getElementById("timbre-notificacion");

    btnFoto.addEventListener("click", () => {
      btnFoto.classList.add("active");
      mensaje.textContent = "📸 Tomando foto...";

      fetch("/capturar")
        .then(r => r.ok ? mensaje.textContent = "✅ Foto guardada" : mensaje.textContent = "❌ Error al capturar")
        .catch(() => mensaje.textContent = "⚠️ No se pudo contactar el servidor")
        .finally(() => setTimeout(() => btnFoto.classList.remove("active"), 1000));
    });

    db.ref("timbres").on("value", snapshot => {
      const data = snapshot.val();

      if (!data) {
        timbreDiv.innerHTML = "🔔 Sin datos recibidos";
        return;
      }

      const evento = data.evento || "Timbre presionado";
      const timestamp = data.timestamp || "Sin fecha";

      timbreDiv.innerHTML = `🔔 ${evento}<br>${timestamp}`;
    });

  </script>

</body>
</html>
